<!doctype html>
<html lang="am">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="light dark" />
<link rel="icon" href="data:," />
<title>ግጥሙን ጨርስ · Finish the Lyrics</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Noto+Sans+Ethiopic:wght@500;600;700;800&display=swap');
:root{
  color-scheme:light dark;
  --bg:#3b1f5e; --bg-deep:#241239; --panel:#fffdf6; --panel-2:#fbf3df;
  --ink:#2c1a12; --muted:#7a6a58; --gold:#f6c548; --gold-deep:#d99a1f;
  --purple:#7c3aed; --green:#1e8a5a; --red:#c0392b; --line:#e6d3a8;
  --shadow:rgba(20,8,35,.35);
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{
  margin:0;font-family:"Baloo 2","Noto Sans Ethiopic",system-ui,sans-serif;
  background:radial-gradient(1000px 500px at 50% -10%, #5b2f8f 0%, var(--bg) 50%, var(--bg-deep) 100%);
  color:#fdf3dd;display:flex;justify-content:center;padding:18px 14px 40px;
}
.wrap{width:100%;max-width:600px}
.card{background:var(--panel);color:var(--ink);border-radius:22px;box-shadow:0 18px 45px var(--shadow);padding:26px 22px;margin-top:14px}
h1{font-size:28px;margin:4px 0;text-align:center}
.sub{text-align:center;color:var(--muted);margin:0 0 10px}
.hidden{display:none!important}
.given{background:#2c1a4d;color:#ffe9a8;border-radius:16px;padding:18px;font-size:19px;line-height:2;text-align:center;white-space:pre-line;margin:12px 0}
.given .q{color:var(--gold);font-weight:800}
.choices{display:grid;gap:10px;margin:12px 0}
.choice{border:0;border-radius:14px;padding:15px 16px;font-family:inherit;font-size:17px;font-weight:600;background:var(--panel-2);color:var(--ink);cursor:pointer;box-shadow:inset 0 0 0 2px var(--line);text-align:center;line-height:1.7}
.choice.correct{background:#d9f5e5;box-shadow:inset 0 0 0 3px var(--green)}
.choice.wrong{background:#fbe3df;box-shadow:inset 0 0 0 3px var(--red)}
.choice:disabled{cursor:default}
.btn{display:block;width:100%;border:0;border-radius:16px;cursor:pointer;font-family:inherit;font-weight:800;font-size:18px;padding:15px;margin:10px 0;background:linear-gradient(180deg,var(--gold),var(--gold-deep));color:#3a2a08;box-shadow:0 6px 0 #a86f14}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #a86f14}
.meta{display:flex;justify-content:space-between;font-weight:800;color:var(--muted);font-size:15px;margin-bottom:4px}
.streak{color:var(--purple)}
.songline{text-align:center;color:var(--muted);font-size:15px;margin-top:8px;min-height:22px}
.yt{margin:10px 0 2px;text-align:center}
.yt iframe{width:100%;aspect-ratio:16/9;border:0;border-radius:14px}
.btn-hear{background:linear-gradient(180deg,#ff6b6b,#d63d3d);color:#fff;box-shadow:0 6px 0 #a11f1f;font-size:16px}
.btn-hear:active{transform:translateY(3px);box-shadow:0 2px 0 #a11f1f}
.big{font-size:22px;font-weight:800;text-align:center}
.score{font-size:52px;font-weight:800;text-align:center;color:var(--purple);margin:6px 0}
.bar{height:8px;background:#e8ddc2;border-radius:99px;overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;background:var(--purple);width:0%}
</style>
</head>
<body>
<div class="wrap">
  <section class="card" id="scr-home">
    <h1>🎤 ግጥሙን ጨርስ</h1>
    <p class="sub">Finish the Lyrics — pick the line that comes next</p>
    <p style="text-align:center;color:var(--muted)">10 rounds · 4 choices · how well do you know your worship songs?</p>
    <button class="btn" id="btn-start">Start ▶</button>
  </section>

  <section class="card hidden" id="scr-game">
    <div class="meta"><span id="round-label">Round 1/10</span><span>⭐ <span id="score">0</span> &nbsp;·&nbsp; <span class="streak">🔥 <span id="streak">0</span></span></span></div>
    <div class="bar"><i id="prog"></i></div>
    <div class="given" id="given"></div>
    <div class="choices" id="choices"></div>
    <p class="songline" id="songline"></p>
    <div class="yt hidden" id="yt-wrap"><button class="btn btn-hear" id="btn-hear">▶ Hear the song</button><div id="yt-player"></div></div>
    <button class="btn hidden" id="btn-next">Next →</button>
  </section>

  <section class="card hidden" id="scr-end">
    <h1>🎉 ጨርሷል!</h1>
    <div class="score" id="final-score">0</div>
    <p class="big" id="final-msg"></p>
    <button class="btn" id="btn-again">Play again ↻</button>
  </section>
</div>
<script>
"use strict";
const $=id=>document.getElementById(id);
const rnd=n=>Math.floor(Math.random()*n);
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]];}return a;};
const clean=s=>(s||"").replace(/\([^)]*\)/g," ").replace(/\s+/g," ").trim();
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;");
let SONGS=[], round=0, score=0, streak=0, correctIdx=0, locked=false, curSong=null;
const ROUNDS=10;

fetch("songs.json").then(r=>r.json()).then(d=>{
  SONGS=d.map(s=>({...s, lines:(s.lyrics||"").split("\n").map(clean).filter(l=>l.length>3)}))
          .filter(s=>s.lines.length>=5);
});
function show(id){document.querySelectorAll("section.card").forEach(s=>s.classList.add("hidden"));$(id).classList.remove("hidden");window.scrollTo(0,0);}
function allLines(){const L=[];SONGS.forEach(s=>s.lines.forEach(l=>L.push(l)));return L;}
let LINES=[];
$("btn-start").onclick=()=>{ if(!SONGS.length){return;} LINES=allLines(); round=0;score=0;streak=0; nextRound(); };
$("btn-again").onclick=()=>{ round=0;score=0;streak=0; nextRound(); };

function nextRound(){
  if(round>=ROUNDS){
    $("final-score").textContent=score+" / "+ROUNDS;
    $("final-msg").textContent = score>=9?"🏆 አሪፍ! Worship master!" : score>=6?"👏 በጣም ጥሩ! Well done!" : score>=3?"💪 Keep singing!" : "🎶 Practice makes perfect!";
    show("scr-end"); return;
  }
  round++; locked=false;
  const song=SONGS[rnd(SONGS.length)]; curSong=song;
  const i=rnd(song.lines.length-2);
  const givenLines=song.lines.slice(i,i+2), correct=song.lines[i+2];
  const distract=shuffle(LINES.filter(l=>l!==correct)).slice(0,3);
  const opts=shuffle([correct].concat(distract));
  correctIdx=opts.indexOf(correct);
  $("round-label").textContent="Round "+round+"/"+ROUNDS;
  $("prog").style.width=((round-1)/ROUNDS*100)+"%";
  $("score").textContent=score; $("streak").textContent=streak;
  $("given").innerHTML=esc(givenLines.join("\n"))+'\n<span class="q">… ?</span>';
  $("songline").textContent="";
  $("yt-wrap").classList.add("hidden");$("yt-player").innerHTML="";$("btn-hear").classList.remove("hidden");
  $("btn-next").classList.add("hidden");
  const box=$("choices"); box.innerHTML="";
  opts.forEach((o,idx)=>{
    const b=document.createElement("button"); b.className="choice"; b.textContent=o;
    b.onclick=()=>{
      if(locked) return; locked=true;
      const btns=box.querySelectorAll("button");
      btns.forEach(x=>x.disabled=true);
      btns[correctIdx].classList.add("correct");
      if(idx===correctIdx){ score++; streak++; } else { b.classList.add("wrong"); streak=0; }
      $("score").textContent=score; $("streak").textContent=streak;
      $("songline").textContent="🎵 "+song.artist+" — "+song.title;
      if(song.video_id){$("yt-wrap").classList.remove("hidden");}
      $("prog").style.width=(round/ROUNDS*100)+"%";
      const nb=$("btn-next"); nb.classList.remove("hidden");
      nb.textContent = round>=ROUNDS ? "See results →" : "Next →";
    };
    box.appendChild(b);
  });
  show("scr-game");
}
$("btn-next").onclick=nextRound;
$("btn-hear").onclick=()=>{
  const id=((curSong&&curSong.video_id)||"").trim();
  if(!id) return;
  $("btn-hear").classList.add("hidden");
  $("yt-player").innerHTML='<iframe src="https://www.youtube.com/embed/'+encodeURIComponent(id)+'?autoplay=1&rel=0" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>';
};
</script>
</body>
</html>
